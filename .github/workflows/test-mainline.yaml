name: Test Current mainline

on:
  push:
    branches:
      - mainline

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Unit Tests And Post Coverage
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{secrets.SMARTSHEET_ACCESS_TOKEN}}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: ./gradlew clean build jacocoTestReport coveralls

  shared-mock-api-sdk-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Clone smartsheet/smartsheet-sdk-tests PUBLIC repository
        uses: actions/checkout@v6
        with:
          repository: smartsheet/smartsheet-sdk-tests
          path: smartsheet-sdk-tests
      - name: Setup Mock API
        run: |
          docker compose -f smartsheet-sdk-tests/docker-compose.yml up -d --wait
      - name: Run Mock API SDK Tests
        run: ./gradlew clean sdkTest
